name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained single-file exe
        run: dotnet publish src/WorldClockBar -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Pack zip
        run: Compress-Archive -Path publish/WorldClockBar.exe -DestinationPath "WorldClockBar-${env:GITHUB_REF_NAME}-win-x64.zip"

      - name: Create release with exe
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${env:GITHUB_REF_NAME}"
          "WorldClockBar-${env:GITHUB_REF_NAME}-win-x64.zip"
          --title "WorldClockBar ${env:GITHUB_REF_NAME}"
          --generate-notes --verify-tag --latest
